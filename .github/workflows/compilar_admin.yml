name: Compilar APK Gerenciador Admin

on:
  workflow_dispatch:

jobs:
  build-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 1. Gerar Estrutura Android
        run: flutter create . --platforms=android --org com.osprime

      - name: 2. Injetar Chave Fixa e Pacote Exclusivo Admin
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          mkdir -p ~/.android
          cp chave_assinatura.keystore ~/.android/debug.keystore
          cp chave_assinatura.keystore android/app/debug.keystore

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i '/signingConfigs {/a \        getByName("debug") { storeFile = file("debug.keystore") }' android/app/build.gradle.kts
            sed -i 's/applicationId *= *"[^"]*"/applicationId = "com.osprime.admin"/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i '/signingConfigs {/a \        debug { storeFile file("debug.keystore") }' android/app/build.gradle
            sed -i 's/applicationId *"[^"]*"/applicationId "com.osprime.admin"/g' android/app/build.gradle
          fi

          sed -i 's/android:label="[^"]*"/android:label="O.S. Prime Admin"/g' android/app/src/main/AndroidManifest.xml

          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '/plugins {/a \    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            sed -i '/plugins {/a \    id("com.google.gms.google-services")' android/app/build.gradle.kts
          elif [ -f "android/settings.gradle" ]; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle
            sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle
          else
            sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi

      - name: 3. Instalar Dependências
        run: flutter pub get

      - name: 4. Compilar APK Gerenciador Admin
        run: |
          mkdir -p apks_prontos
          flutter build apk --release -t lib/main_admin.dart --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk apks_prontos/OS-Prime-Gerenciador-Admin-v${{ github.run_number }}.apk

      - name: 5. Disponibilizar APK Gerenciador para Download
        uses: actions/upload-artifact@v4
        with:
          name: APK-GERENCIADOR-ADMIN-v${{ github.run_number }}
          path: apks_prontos/OS-Prime-Gerenciador-Admin-v${{ github.run_number }}.apk