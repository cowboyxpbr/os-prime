name: Gerar Chave Fixa

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Criar Chave Fixa e Mostrar Código
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore ~/.android/debug.keystore -storepass android -keypass android -dname "CN=Eletro Heinzen, O=Eletro, C=BR"
          echo "==================== COPIE O TEXTO ABAIXO ===================="
          base64 -w 0 ~/.android/debug.keystore
          echo ""
          echo "=============================================================="
